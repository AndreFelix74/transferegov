<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cozinha Solidária — Acompanhamento de Parcerias</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<style>
  header.topo.topo--landing {
    position: sticky;
    top: 0;
    z-index: 100;
  }

  /* ---------- hub: seções ---------- */
  main.hub{
    max-width:1100px; margin:0 auto;
    padding: 28px clamp(20px,6vw,64px) 56px;
    display:flex; flex-direction:column; gap:32px;
  }

  .secao{
    --cor-secao: var(--laranja);
    background: var(--papel-carta);
    border:1px solid var(--linha);
    border-radius:12px;
    box-shadow: var(--sombra);
    overflow:hidden;
  }
  .secao::before{
    content:"";
    display:block; height:4px;
    background: var(--cor-secao);
  }

  .secao-cabecalho{
    padding: 22px 24px 0;
  }
  .secao .rotulo-secao{
    font-family:"IBM Plex Mono"; font-size:14px; text-transform:uppercase; letter-spacing:.08em;
    color: var(--cor-secao);
    font-weight:600;
  }

  .secao-cards{
    padding: 18px 24px 24px;
    display:grid; gap:20px;
  }
  .secao-cards--3{ grid-template-columns: repeat(3, 1fr); }
  .secao-cards--4{ grid-template-columns: repeat(4, 1fr); }
  .secao-cards--2{
    grid-template-columns: repeat(2, 1fr);
    max-width:860px;
  }
  .secao-cards--1{
    grid-template-columns: 1fr;
    max-width:420px;
  }
  @media (max-width: 1100px){
    .secao-cards--4{ grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 880px){
    .secao-cards--2,
    .secao-cards--3,
    .secao-cards--4{ grid-template-columns:1fr; }
    .secao-cards--1,
    .secao-cards--2{ max-width:none; }
  }

  /* ---------- cards (portas) ---------- */
  .porta{
    --cor-porta: var(--cor-secao);
    background: var(--papel-carta);
    border:1px solid var(--linha);
    border-radius:12px;
    box-shadow: var(--sombra);
    padding: 20px 22px;
    display:flex; flex-direction:column;
    text-decoration:none; color:inherit;
    position:relative;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .porta:hover{ transform: translateY(-3px); box-shadow: 0 1px 2px rgba(43,37,48,.08), 0 20px 36px -16px rgba(43,37,48,.28); }
  .porta::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:4px;
    border-radius:12px 12px 0 0;
    background: var(--cor-porta);
  }

  .porta h2{ margin:0; font-size:18px; font-weight:600; line-height:1.3; }
</style>
</head>
<body>

<header class="topo topo--landing">
  <span class="eyebrow">Programa Cozinha Solidária · MDS</span>
  <h1>Acompanhamento de Parcerias</h1>
</header>

<main class="hub">

  <!-- PAINÉIS DE GESTÃO DE PARCEIRAS -->
  <section class="secao" style="--cor-secao:#69438c">
    <div class="secao-cabecalho">
      <span class="rotulo-secao">Paineis de Gestão de Parceiras</span>
    </div>
    <div class="secao-cards secao-cards--4">

      <a class="porta" href="gerencial.html">
        <h2>Gerencial</h2>
      </a>

      <a class="porta" href="parcerias.html">
        <h2>Operacional</h2>
      </a>

      <a class="porta" href="tecnicos.html">
        <h2>Técnicos</h2>
      </a>

      <a class="porta" href="instrumentos-parceria.html">
        <h2>Instrumentos de Parceria</h2>
      </a>

      <a class="porta" href="valor-pactuado.html">
        <h2>Valor Pactuado</h2>
      </a>

    </div>
  </section>

  <!-- FERRAMENTA DE PRESTAÇÃO DE CONTAS -->
  <section class="secao" style="--cor-secao:#317c5d">
    <div class="secao-cabecalho">
      <span class="rotulo-secao">Ferramenta de Prestação de Contas</span>
    </div>
    <div class="secao-cards secao-cards--2">

      <a class="porta" href="operacional.html">
        <h2>Análise</h2>
      </a>

      <a class="porta" href="relatorio-mensal.html">
        <h2>Relatório Mensal de Produção</h2>
      </a>

    </div>
  </section>

</main>

<footer class="rodape-pagina">
  <span>Dados: TransfereGov / SICONV</span>
  <span>Cozinha Solidária — MDS</span>
</footer>

</body>
</html>
